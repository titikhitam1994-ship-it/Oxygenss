<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oxygenss</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#007bff,#00c6ff);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:white;
border-radius:25px;
padding:30px 25px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
text-align:center;
}

.logo{
font-size:45px;
}

h1{
font-size:42px;
font-weight:900;
color:#0645d9;
margin:10px 0;
}

.sub{
color:#555;
font-size:18px;
}

.box{
background:#f3f8ff;
padding:18px;
border-radius:15px;
margin-top:20px;
}

.label{
font-weight:bold;
color:#555;
}

.name{
font-size:22px;
font-weight:bold;
margin-top:8px;
}

.rekening{
font-size:30px;
font-weight:bold;
letter-spacing:2px;
color:#0645d9;
margin:15px 0;
}

button{
width:100%;
border:none;
padding:16px;
border-radius:15px;
background:#075cff;
color:white;
font-size:18px;
font-weight:bold;
}

.info{
margin-top:20px;
color:#444;
line-height:1.5;
}

.footer{
margin-top:25px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">🏦</div>

<h1>Oxygenss</h1>

<div class="sub">
Pembayaran via SeaBank
</div>


<div class="box">

<div class="label">
Nama Penerima
</div>

<div class="name">
UMXXX ISXXXX
</div>

</div>


<div class="box">

<div class="label">
Nomor Rekening SeaBank
</div>

<div class="rekening" id="rekening">
901553800061
</div>

<button onclick="salin()">
📋 Salin Nomor Rekening
</button>

</div>


<div class="info">
Silakan transfer ke rekening SeaBank di atas.
<br>
Pastikan nama penerima sesuai sebelum pembayaran.
</div>


<div class="footer">
Terima kasih atas kepercayaan Anda 🙏
</div>


</div>


<script>

function salin(){

navigator.clipboard.writeText("901553800061");

alert("Nomor rekening berhasil disalin");

}

</script>


</body>
</html>
